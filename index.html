  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    const v = get(k);
    if(v) el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    const k = el.getAttribute("data-i18n-ph");
    const v = get(k);
    if(v) el.placeholder = v;
  });
  // 分类chips（用 data-catkey，不依赖当前文本）
  document.querySelectorAll("#chips span[data-catkey]").forEach(chip => {
    const key = chip.dataset.catkey;
    if(key){ const v = get(key); if(v) chip.textContent = v; }
  });
  // 页脚
  const footNote = document.querySelector(".foot-base");
  if(footNote){
    const privacyLink = footNote.querySelector('a[href="./privacy.html"]');
    const privacyText = privacyLink ? privacyLink.outerHTML.replace(/>[^<]*</, `>${get("privacy")}<`) : "";
    footNote.innerHTML = get("foot_note") + ' &nbsp;·&nbsp; ' + privacyText;
  }
  // html lang属性
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
}

function stars(n){ return "★".repeat(n)+"☆".repeat(5-n); }
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
function platShort(s){ return s.plat==="Windows"?" · Win":s.plat==="macOS"?" · Mac":""; }
function render(list, q){
  const box = document.getElementById("results");
  if(!q){ const lang3 = COUNTRY_LANG[activeRegion] || "zh"; const hintT = {zh:"⬆ 在上面输入需求，或点分类看看收录了什么",zht:"⬆ 在上面輸入需求，或點分類看看收錄了什麼",en:"⬆ Search above, or browse categories",ja:"⬆ 上で検索、またはカテゴリーを見る",ko:"⬆ 위에서 검색하거나 카테고리 보기",de:"⬆ Oben suchen oder Kategorien ansehen",fr:"⬆ Recherchez ci-dessus ou parcourez les catégories",es:"⬆ Busca arriba o explora las categorías",pt:"⬆ Pesquise acima ou explore as categorias"}[lang3] || "⬆ Search above, or browse categories"; box.innerHTML = `<div class="meta">${hintT}</div>`; return; }
  if(!list.length){ const lang6 = COUNTRY_LANG[activeRegion] || "zh"; const emptyT = {zh:`没搜到"${q}"相关的站<br><br>我们只收录人工验过的站，覆盖面还在扩充中`,zht:`沒搜到"${q}"相關的站<br><br>我們只收錄人工驗過的站，覆蓋面還在擴充中`,en:`No results for "${q}"<br><br>We only list manually verified sites, coverage is growing`}[lang6] || `No results for "${q}"<br><br>We only list manually verified sites, coverage is growing`; box.innerHTML = `<div class="empty">${emptyT}</div>`; return; }
  // 赞助位置顶并标注，其余按推荐指数排序
  list.sort((a,b)=>((b.sponsored?1:0)-(a.sponsored?1:0)) || ((b.official?1:0)-(a.official?1:0)) || (b.rating-a.rating));
  const scope = activeRegion ? `在${COUNTRY_NAMES[activeRegion]||activeRegion}` : "";
  const lang5 = COUNTRY_LANG[activeRegion] || "zh";
  const foundT = {zh:`${scope}找到 ${list.length} 个亲测过的站（推广位已标注）`,zht:`${scope}找到 ${list.length} 個親測過的站（推廣位已標註）`,en:`${list.length} verified sites${activeRegion?' in '+activeRegion:''} (sponsored labeled)`,ja:`${list.length} 件の検証済みサイト`,ko:`검증된 사이트 ${list.length}개`,de:`${list.length} geprüfte Seiten`,fr:`${list.length} sites vérifiés`,es:`${list.length} sitios verificados`,pt:`${list.length} sites verificados`}[lang5] || `${list.length} verified sites (sponsored labeled)`;
  const meta = `<div class="meta">${foundT}</div>`;
  const t5 = I18N[lang5] || I18N.zh; const en5 = I18N.en;
  const g5 = k => t5[k] || en5[k] || I18N.zh[k];
  // 补充翻译键
  const priceT = s.price === "免费" ? (g5("price_free") || "Free") : s.price;
  const offT = g5("verified") || "官网认证";
  const goT = g5("go") || "直达 →";
  const dlT = g5("dl") || "💾 可下载";
  const adT = g5("ad") || "推广";
  const cardHtml = (s,i)=>`
    <div class="card${s.sponsored?" sponsored":""}">
      <div class="rank">${i+1}</div>
      <div class="body">
        <h3>${s.icon?`<img class="cic" src="./icons/${s.icon}" alt="" loading="lazy" onerror="this.remove()">`:`<span class="globe">🌍</span>`}${s.name}<span class="stars">${stars(s.rating)}</span></h3>
        <div class="domain">${host(s.url)}</div>
        <div class="tags"><i class="cat">${catT(s.cat)}</i><i class="price">${priceT}</i>${s.region?`<i class="${s.region==="CN"?"region-dom":"region-for"}">${COUNTRY_NAMES[s.region]||s.region}</i>`:''}${(s.plat&&s.plat!=="网页")?`<i class="plat">${s.plat}</i>`:''}${s.dl?`<i class="dl">${dlT}</i>`:''}${s.official?`<i class="off">${offT}</i>`:''}${s.sponsored?`<i class="ad">${adT}</i>`:''}</div>
        <p>${s.desc}</p>
      </div>
      <a class="go" href="${s.url}" target="_blank" rel="noopener">${goT}</a>
    </div>`;
  // 全部模式：按国家分组；选了国家：直接两列
  if(!activeRegion){
    const groups = {};
    list.forEach(s => { const c = s.region || "CN"; (groups[c] = groups[c] || []).push(s); });
    const order = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);
    box.innerHTML = meta + order.map(c =>
      `<div class="country-group"><div class="country-head">${COUNTRY_NAMES[c]||c} · ${groups[c].length}个</div><div class="cards-grid">` +
      groups[c].map((s,i) => cardHtml(s,i)).join("") + `</div></div>`
    ).join("");
  } else {
    box.innerHTML = meta + `<div class="cards-grid">` + list.map((s,i)=>cardHtml(s,i)).join("") + `</div>`;
  }
}
function doSearch(){
  const q = document.getElementById("q").value.trim();
  if(!q && !onlyDownloadable && !activePlat && !activeRegion){ render([], ""); return; }
  let res = q ? fuse.search(q).map(r=>r.item) : [...SITES];
  if(activeRegion){ res = res.filter(s => s.region === activeRegion); }
  if(activePlat){ res = res.filter(s => s.plat === activePlat || s.plat === "双平台" || s.plat === "网页"); }
  if(onlyDownloadable){ res = res.filter(s => s.dl); }
  render(res, q || "筛选");
  if(q) history.replaceState(null,"","?q="+encodeURIComponent(q));
}

(function(){
  const inp = document.getElementById("fbReal");
  const box = document.getElementById("fbSuggest");
  if(!inp) return;
  inp.addEventListener("input", () => {
    const q = inp.value.trim().toLowerCase();
    if(q.length < 1){ box.style.display = "none"; return; }
    const hits = SITES.filter(s => (s.name + " " + (s.kw||"")).toLowerCase().includes(q)).slice(0, 6);
    if(!hits.length){ box.style.display = "none"; return; }
    box.innerHTML = hits.map(s => {
      const i = SITES.indexOf(s);
      return `<div class="fb-sug" data-i="${i}">${s.icon?`<img src="./icons/${s.icon}" alt="" onerror="this.remove()">`:`<span class="globe">🌍</span>`}<span>${s.name}</span><em>${host(s.url)}</em></div>`;
    }).join("");
    box.style.display = "block";
    box.querySelectorAll(".fb-sug").forEach(el => {
      el.onmousedown = (e) => { e.preventDefault(); inp.value = SITES[+el.dataset.i].name; box.style.display = "none"; };
    });
  });
  inp.addEventListener("blur", () => setTimeout(() => box.style.display = "none", 200));
})();
// 推荐新网站提交
async function submitNewSite(){
  const name = document.getElementById("fbNewName").value.trim();
  const url = document.getElementById("fbNewUrl").value.trim();
  const desc = document.getElementById("fbNewDesc").value.trim();
  if(!name){ alert("请填写网站 / 软件名称"); return; }
  const btn = document.getElementById("fbSubmitNew");
  const okEl = document.getElementById("fbOkNew");
  btn.disabled = true; btn.textContent = "提交中…";
  try{
    const r = await fetch("/api/feedback", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ type:"new", name, url, desc }) });
    const j = await r.json().catch(()=>({ok:false}));
    if(j.ok){ okEl.style.display = "block"; btn.textContent = "已提交"; setTimeout(closeFbModal, 1500); return; }
    alert("提交失败，请稍后重试");
  }catch(e){ alert("提交失败，请检查网络后重试"); }
  btn.disabled = false; btn.textContent = "提交推荐";
}

// 分类导航：全部站点按分类铺成方块
function buildNav(){
  const anchors = document.getElementById("navAnchors");
  const cats = document.getElementById("navCats");
  anchors.innerHTML = ""; cats.innerHTML = "";
  CATS.forEach((c, idx) => {
    let list = SITES.filter(s => s.cat === c);
    if(activeRegion){ list = list.filter(s => s.region === activeRegion); }
    if(!list.length) return;
    const aid = "cat-" + idx;
    const a = document.createElement("a"); a.href = "#"+aid; a.textContent = catT(c) + " " + list.length; anchors.appendChild(a);
    const div = document.createElement("div"); div.className = "cat-block"; div.id = aid;
    const lang2 = COUNTRY_LANG[activeRegion] || "zh";
    const cntT = {zh:"个站",zht:"個站",en:"sites",ja:"サイト",ko:"개 사이트",de:"Seiten",fr:"sites",es:"sitios",pt:"sites",it:"siti",nl:"sites",ru:"сайтов",th:"เว็บ",vi:"trang",id:"situs",tr:"site",ar:"موقع",he:"אתרים",pl:"stron",cs:"webů",da:"sider",sv:"sidor",fi:"sivua",no:"sider",el:"ιστότοποι"}[lang2] || "sites";
    div.innerHTML = `<h3>${catT(c)}<span class="cnt">${list.length} ${cntT}</span></h3><div class="site-grid">` +
      list.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.icon?`<img class="sic" src="./icons/${s.icon}" alt="" loading="lazy" onerror="this.remove()">`:`<span class="sic globe">🌍</span>`}<span class="stext"><span class="sname">${s.name}</span><span class="sdomain">${host(s.url)}${platShort(s)}</span></span></a>`).join("") + `</div>`;
    cats.appendChild(div);
  });
  // 快捷直达：按地区动态显示（未选地区时显示中国版）
  const qg = document.getElementById("quickGrid");
  if(qg){
    const rc = activeRegion || "CN";
    let list = [];
    const names = QUICK[rc];
    if(names){
      list = names.map(n => SITES.find(s => s.name === n)).filter(Boolean);
    } else {
      list = SITES.filter(s => s.region === rc).sort((a,b) => b.rating - a.rating).slice(0,12);
    }
    const lang4 = COUNTRY_LANG[activeRegion] || "zh";
    qg.innerHTML = list.map(s => {
      const dname = (lang4 !== "zh" && lang4 !== "zht" && SITE_EN[s.name]) ? SITE_EN[s.name] : s.name;
      return `<a href="${s.url}" target="_blank" rel="noopener">${s.icon?`<img class="qic" src="./icons/${s.icon}" alt="" loading="lazy" onerror="this.remove()">`:`<span class="qic globe">🌍</span>`}${dname}<span class="cat">${catT(s.cat)}</span><span class="dom">${host(s.url)}${platShort(s)}</span></a>`;
    }).join("");
  }
}
