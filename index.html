<script>

const CATS = ["装机必备","AI 工具","办公效率","影音娱乐","社交社区","生活服务","购物消费","学习教育","金融投资","开发工具","常用软件","设计创意","新闻资讯","阅读创作","常用网站"];
const COUNTRY_NAMES = {CN:"中国",US:"美国",CA:"加拿大",GB:"英国",KR:"韩国",JP:"日本",SG:"新加坡",HK:"香港",TW:"台湾",DE:"德国",FR:"法国",IT:"意大利",ES:"西班牙",PT:"葡萄牙",NL:"荷兰",BE:"比利时",AT:"奥地利",PL:"波兰",CZ:"捷克",DK:"丹麦",SE:"瑞典",FI:"芬兰",IE:"爱尔兰",AE:"阿联酋",SA:"沙特",RU:"俄罗斯",TR:"土耳其",IL:"以色列",NO:"挪威",CH:"瑞士",IN:"印度",TH:"泰国",VN:"越南",MY:"马来西亚",PH:"菲律宾",ID:"印尼",AU:"澳大利亚",NZ:"新西兰",BR:"巴西",MX:"墨西哥",AR:"阿根廷",ZA:"南非",EG:"埃及",GR:"希腊"};
// 各国快捷直达（按名称匹配SITES，未列出的国家取该国rating最高的12个）
const QUICK = {
CN:["微信 PC 版","Chrome 浏览器","ChatGPT","DeepSeek","哔哩哔哩","抖音","小红书","京东","12306","向日葵远程","火绒安全","GitHub"],
US:["Google","YouTube","Facebook","亚马逊","X","Instagram","Netflix","Reddit","Gmail","ChatGPT","GitHub","Google Scholar"],
GB:["BBC","Google","Amazon UK","Facebook","YouTube","X","Instagram","Netflix","Tesco","Rightmove","BBC News","The Guardian"],
JP:["Yahoo! Japan","LINE","Rakuten","YouTube","X","Amazon Japan","Niconico","Mercari","NHK","朝日新聞","JR东日本","日本邮政"],
KR:["Naver","Kakao","YouTube","Coupang","X","Instagram","11번가","Gmarket","Melon","韩联社","Korail","KakaoBank"],
DE:["Google","YouTube","Amazon DE","Facebook","Instagram","Otto","Zalando","ARD","ZDF","Spiegel","Deutsche Bahn","Sparkasse"],
FR:["Google","YouTube","Facebook","亚马逊","Fnac","Cdiscount","Canal+","Deezer","Le Monde","SNCF","La Poste","BNP Paribas"],
TW:["Google","YouTube","Facebook","PChome","momo","Shopee TW","PTT","Dcard","中央社","台铁","台湾高铁","中华电信"],
HK:["Google","YouTube","Facebook","HKTVmall","OpenRice","ViuTV","TVB","HK01","SCMP","MTR","HSBC HK","HK Gov"],
SG:["Google","YouTube","Facebook","Shopee SG","Lazada SG","Grab","Mediacorp","Straits Times","DBS","Singapore Airlines","Singapore Gov","FairPrice"],
};
let activePlat = "";
let onlyDownloadable = false;
let activeRegion = "";
// 浏览器语言 -> 国家代码
function langToCountry(){
  const lang = (navigator.language || "en").toLowerCase();
  const map = {
    "zh-cn":"CN","zh-sg":"SG","zh-hk":"HK","zh-tw":"TW","zh":"CN",
    "en-us":"US","en-gb":"GB","en-ca":"CA","en-au":"AU","en-nz":"NZ","en-ie":"IE","en":"US",
    "ja":"JP","ko":"KR","de":"DE","fr":"FR","it":"IT","es-mx":"MX","es-ar":"AR","es":"ES",
    "pt-br":"BR","pt":"PT","nl-be":"BE","nl":"NL","ru":"RU","th":"TH","vi":"VN","id":"ID","ms":"MY",
    "tr":"TR","ar-sa":"SA","ar-ae":"AE","ar-eg":"EG","ar":"SA","he":"IL","pl":"PL","cs":"CZ",
    "da":"DK","sv":"SE","fi":"FI","no":"NO","el":"GR"
  };
  if(map[lang]) return map[lang];
  const base = lang.split("-")[0];
  return map[base] || "";
}
const fuse = new Fuse(SITES, { keys:[{name:"name",weight:.4},{name:"kw",weight:.35},{name:"desc",weight:.15},{name:"cat",weight:.1}], threshold:.45, ignoreLocation:true });

const chipsEl = document.getElementById("chips");
CATS.forEach(c => { const s=document.createElement("span"); s.textContent=c; s.onclick=()=>{document.getElementById("q").value=c; doSearch();}; chipsEl.appendChild(s); });
// 搜索框前置筛选：平台下拉 + 可下载开关；右上角地区选择
const regionSel = document.getElementById("regionSel");
regionSel.onchange = () => { activeRegion = regionSel.value; try{ localStorage.setItem("rg_region", activeRegion); }catch(e){} doSearch(); buildNav(); };
// 首次访问：按浏览器语言自动选国家（用户手动选过则记住选择）
try{
  const saved = localStorage.getItem("rg_region");
  if(saved !== null){ activeRegion = saved; regionSel.value = saved; }
  else { const auto = langToCountry(); if(auto && regionSel.querySelector(`option[value="${auto}"]`)){ activeRegion = auto; regionSel.value = auto; } }
}catch(e){}
const platSel = document.getElementById("platSel");
platSel.onchange = () => { activePlat = platSel.value; doSearch(); };
const dlToggle = document.getElementById("dlToggle");
dlToggle.onclick = () => {
  onlyDownloadable = !onlyDownloadable;
  dlToggle.classList.toggle("on", onlyDownloadable);
  doSearch();
};
// 顶导航
document.getElementById("topnav").addEventListener("click", e => {
  const a = e.target.closest("a"); if(!a) return; e.preventDefault();
  const k = a.dataset.nav, qEl = document.getElementById("q");
  if(k === "home"){
    qEl.value = ""; activePlat = ""; platSel.value = ""; activeRegion = ""; regionSel.value = "";
    if(onlyDownloadable) dlToggle.click();
    history.replaceState(null, "", location.pathname);
    render([], ""); buildNav(); window.scrollTo({top:0, behavior:"smooth"});
  } else if(k === "hot"){
    qEl.value = ""; if(!onlyDownloadable) dlToggle.click();
    doSearch(); document.getElementById("results").scrollIntoView({behavior:"smooth"});
  } else if(k === "ai"){
    qEl.value = "AI"; doSearch();
    document.getElementById("results").scrollIntoView({behavior:"smooth"});
  } else if(k === "nav"){
    document.getElementById("navsec").scrollIntoView({behavior:"smooth"});
  } else if(k === "about"){
    document.querySelector(".footer").scrollIntoView({behavior:"smooth"});
  }
});

function stars(n){ return "★".repeat(n)+"☆".repeat(5-n); }
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
function platShort(s){ return s.plat==="Windows"?" · Win":s.plat==="macOS"?" · Mac":""; }
function render(list, q){
  const box = document.getElementById("results");
  if(!q){ box.innerHTML = `<div class="meta">⬆ 在上面输入需求，或点分类看看收录了什么</div>`; return; }
  if(!list.length){ box.innerHTML = `<div class="empty">没搜到"${q}"相关的站<br><br>我们只收录人工验过的站，覆盖面还在扩充中</div>`; return; }
  // 赞助位置顶并标注，其余按推荐指数排序
  list.sort((a,b)=>((b.sponsored?1:0)-(a.sponsored?1:0)) || ((b.official?1:0)-(a.official?1:0)) || (b.rating-a.rating));
  const scope = activeRegion ? `在${COUNTRY_NAMES[activeRegion]||activeRegion}` : "";
  const meta = `<div class="meta">${scope}找到 ${list.length} 个亲测过的站（推广位已标注）</div>`;
  const cardHtml = (s,i)=>`
    <div class="card${s.sponsored?" sponsored":""}">
      <div class="rank">${i+1}</div>
      <div class="body">
        <h3>${s.icon?`<img class="cic" src="./icons/${s.icon}" alt="" loading="lazy" onerror="this.remove()">`:`<span class="globe">🌍</span>`}${s.name}<span class="stars">${stars(s.rating)}</span></h3>
        <div class="domain">${host(s.url)}</div>
        <div class="tags"><i class="cat">${s.cat}</i><i class="price">${s.price}</i>${s.region?`<i class="${s.region==="CN"?"region-dom":"region-for"}">${COUNTRY_NAMES[s.region]||s.region}</i>`:''}${(s.plat&&s.plat!=="网页")?`<i class="plat">${s.plat}</i>`:''}${s.dl?'<i class="dl">💾 可下载</i>':''}${s.official?'<i class="off">官网认证</i>':''}${s.sponsored?'<i class="ad">推广</i>':''}</div>
        <p>${s.desc}</p>
      </div>
      <a class="go" href="${s.url}" target="_blank" rel="noopener">直达 →</a>
    </div>`;
  // 全部模式：按国家分组；选了国家：直接两列
  if(!activeRegion){
    const groups = {};
    list.forEach(s => { const c = s.region || "CN"; (groups[c] = groups[c] || []).push(s); });
    const order = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);
    box.innerHTML = meta + order.map(c =>
      `<div class="country-group"><div class="country-head">${COUNTRY_NAMES[c]||c} · ${groups[c].length}个</div><div class="cards-grid">` +
      groups[c].map((s,i) => cardHtml(s,i)).join("") + `</div></div>`
    ).join("");
  } else {
    box.innerHTML = meta + `<div class="cards-grid">` + list.map((s,i)=>cardHtml(s,i)).join("") + `</div>`;
  }
}
function doSearch(){
  const q = document.getElementById("q").value.trim();
  if(!q && !onlyDownloadable && !activePlat && !activeRegion){ render([], ""); return; }
  let res = q ? fuse.search(q).map(r=>r.item) : [...SITES];
  if(activeRegion){ res = res.filter(s => s.region === activeRegion); }
  if(activePlat){ res = res.filter(s => s.plat === activePlat || s.plat === "双平台" || s.plat === "网页"); }
  if(onlyDownloadable){ res = res.filter(s => s.dl); }
  render(res, q || "筛选");
  if(q) history.replaceState(null,"","?q="+encodeURIComponent(q));
}
document.getElementById("q").addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(); });
// 反馈弹窗
function openFbModal(tab){
  document.getElementById("fbModal").style.display = "flex";
  document.body.style.overflow = "hidden";
  if(tab) switchFbTab(tab);
}
function closeFbModal(){
  document.getElementById("fbModal").style.display = "none";
  document.body.style.overflow = "";
}
document.addEventListener("keydown", e => { if(e.key === "Escape") closeFbModal(); });
document.getElementById("fbModal").addEventListener("click", e => { if(e.target.id === "fbModal") closeFbModal(); });
// 反馈区：折叠 / Tab 切换
function switchFbTab(t){
  document.querySelectorAll(".fb-tab").forEach(x => x.classList.toggle("active", x.dataset.tab === t));
  document.getElementById("fbPaneFake").style.display = t === "fake" ? "block" : "none";
  document.getElementById("fbPaneNew").style.display = t === "new" ? "block" : "none";
}
// 冒充对象：搜索本站自动填充
(function(){
  const inp = document.getElementById("fbReal");
  const box = document.getElementById("fbSuggest");
  if(!inp) return;
  inp.addEventListener("input", () => {
    const q = inp.value.trim().toLowerCase();
    if(q.length < 1){ box.style.display = "none"; return; }
    const hits = SITES.filter(s => (s.name + " " + (s.kw||"")).toLowerCase().includes(q)).slice(0, 6);
    if(!hits.length){ box.style.display = "none"; return; }
    box.innerHTML = hits.map(s => {
      const i = SITES.indexOf(s);
      return `<div class="fb-sug" data-i="${i}">${s.icon?`<img src="./icons/${s.icon}" alt="" onerror="this.remove()">`:`<span class="globe">🌍</span>`}<span>${s.name}</span><em>${host(s.url)}</em></div>`;
    }).join("");
    box.style.display = "block";
    box.querySelectorAll(".fb-sug").forEach(el => {
      el.onmousedown = (e) => { e.preventDefault(); inp.value = SITES[+el.dataset.i].name; box.style.display = "none"; };
    });
  });
  inp.addEventListener("blur", () => setTimeout(() => box.style.display = "none", 200));
})();
// 推荐新网站提交
async function submitNewSite(){
  const name = document.getElementById("fbNewName").value.trim();
  const url = document.getElementById("fbNewUrl").value.trim();
  const desc = document.getElementById("fbNewDesc").value.trim();
  if(!name){ alert("请填写网站 / 软件名称"); return; }
  const btn = document.getElementById("fbSubmitNew");
  const okEl = document.getElementById("fbOkNew");
  btn.disabled = true; btn.textContent = "提交中…";
  try{
    const r = await fetch("/api/feedback", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ type:"new", name, url, desc }) });
    const j = await r.json().catch(()=>({ok:false}));
    if(j.ok){ okEl.style.display = "block"; btn.textContent = "已提交"; setTimeout(closeFbModal, 1500); return; }
    alert("提交失败，请稍后重试");
  }catch(e){ alert("提交失败，请检查网络后重试"); }
  btn.disabled = false; btn.textContent = "提交推荐";
}
async function submitFeedback(){
  const fake = document.getElementById("fbFake").value.trim();
  const real = document.getElementById("fbReal").value.trim();
  const note = document.getElementById("fbNote").value.trim();
  const honey = document.getElementById("fbWeb").value;
  if(!fake && !real){ alert("请至少填写假网站网址或被冒充的官网"); return; }
  const btn = document.getElementById("fbSubmit");
  const okEl = document.getElementById("fbOk");
  btn.disabled = true; btn.textContent = "提交中…";
  const fallbackCopy = () => {
    const txt = "【认官网-假网站反馈】\n假网站：" + (fake||"未填") + "\n冒充对象：" + (real||"未填") + "\n补充说明：" + (note||"无");
    const done = () => { okEl.textContent = "⚠️ 直接提交失败，已复制反馈内容，请稍后重试。"; okEl.style.display = "block"; };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>alert("提交失败，请手动复制")); }
    else alert("提交失败，请手动复制");
    btn.disabled = false; btn.textContent = "提交反馈";
  };
  try{
    const r = await fetch("/api/feedback", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ fake, real, note, website: honey }) });
    const j = await r.json().catch(()=>({ok:false}));
    if(j.ok){ okEl.textContent = "✅ 已提交，我们核实后会处理。"; okEl.style.display = "block"; btn.textContent = "已提交"; setTimeout(closeFbModal, 1500); return; }
    fallbackCopy();
  }catch(e){ fallbackCopy(); }
}
function copyFeedback(){
  const fake = document.getElementById("fbFake").value.trim();
  const real = document.getElementById("fbReal").value.trim();
  const note = document.getElementById("fbNote").value.trim();
  if(!fake && !real){ alert("请至少填写假网站网址或被冒充的官网"); return; }
  const txt = "【认官网-假网站反馈】\n假网站：" + (fake||"未填") + "\n冒充对象：" + (real||"未填") + "\n补充说明：" + (note||"无");
  const done = () => { document.getElementById("fbOk").textContent = "✅ 已复制，去群里粘贴发送就行，我们看到会处理。"; document.getElementById("fbOk").style.display = "block"; };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>alert("复制失败，请手动复制")); }
  else alert("当前浏览器不支持一键复制，请手动复制");
}
function copyQQNum2(){
  const done = () => alert("QQ群号 1039287882 已复制，去 QQ 搜索加群后粘贴反馈内容即可");
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText("1039287882").then(done).catch(done); }
  else done();
}
(function init(){
  const q = new URLSearchParams(location.search).get("q");
  if(q){ document.getElementById("q").value=q; doSearch(); }
  else render([], "");
  // QQ群号点击复制
  const qqNum = document.getElementById("qqNum");
  if(qqNum){
    const orig = qqNum.textContent.trim();
    qqNum.onclick = () => {
      const done = () => { qqNum.textContent = "已复制!"; setTimeout(()=>{ qqNum.textContent = orig; }, 1200); };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(orig).then(done).catch(done); }
      else { const t=document.createElement("textarea"); t.value=orig; document.body.appendChild(t); t.select(); try{document.execCommand("copy");}catch(e){} document.body.removeChild(t); done(); }
    };
  }
})();
// 分类导航：全部站点按分类铺成方块
function buildNav(){
  const anchors = document.getElementById("navAnchors");
  const cats = document.getElementById("navCats");
  anchors.innerHTML = ""; cats.innerHTML = "";
  CATS.forEach((c, idx) => {
    let list = SITES.filter(s => s.cat === c);
    if(activeRegion){ list = list.filter(s => s.region === activeRegion); }
    if(!list.length) return;
    const aid = "cat-" + idx;
    const a = document.createElement("a"); a.href = "#"+aid; a.textContent = c + " " + list.length; anchors.appendChild(a);
    const div = document.createElement("div"); div.className = "cat-block"; div.id = aid;
    div.innerHTML = `<h3>${c}<span class="cnt">${list.length} 个站</span></h3><div class="site-grid">` +
      list.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.icon?`<img class="sic" src="./icons/${s.icon}" alt="" loading="lazy" onerror="this.remove()">`:`<span class="sic globe">🌍</span>`}<span class="stext"><span class="sname">${s.name}</span><span class="sdomain">${host(s.url)}${platShort(s)}</span></span></a>`).join("") + `</div>`;
    cats.appendChild(div);
  });
  // 快捷直达：按地区动态显示（未选地区时显示中国版）
  const qg = document.getElementById("quickGrid");
  if(qg){
    const rc = activeRegion || "CN";
    let list = [];
    const names = QUICK[rc];
    if(names){
      list = names.map(n => SITES.find(s => s.name === n)).filter(Boolean);
    } else {
      list = SITES.filter(s => s.region === rc).sort((a,b) => b.rating - a.rating).slice(0,12);
    }
    qg.innerHTML = list.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.icon?`<img class="qic" src="./icons/${s.icon}" alt="" loading="lazy" onerror="this.remove()">`:`<span class="qic globe">🌍</span>`}${s.name}<span class="cat">${s.cat}</span><span class="dom">${host(s.url)}${platShort(s)}</span></a>`).join("");
  }
}
buildNav();
</script>
